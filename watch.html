  *{box-sizing:border-box;margin:0;padding:0}

  body{background:#0A0A0B;color:#EDEDED;font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:#EDEDED;text-decoration:none}
  a:hover{color:#00E5C0}
  @keyframes beamShift{0%{background-position:0% 0}100%{background-position:-220% 0}}
  @keyframes dotHue{0%{filter:drop-shadow(0 0 10px #00E5C0) drop-shadow(0 0 22px #FF5E3A) hue-rotate(0deg)}100%{filter:drop-shadow(0 0 10px #00E5C0) drop-shadow(0 0 22px #FF5E3A) hue-rotate(360deg)}}
  @keyframes soundPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,192,.45)}50%{box-shadow:0 0 0 14px rgba(0,229,192,0)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#laser-layer{display:none}}

  [data-sound-toggle]{animation:soundPulse 2.2s ease-out infinite}
  [data-sound-toggle]:hover{background:rgba(0,229,192,.16)!important;transform:translateY(-2px)}
  [data-sound-toggle].is-on{background:#00E5C0!important;color:#04211C!important;border-color:#00E5C0!important;animation:none}
  [data-sound-toggle].is-on:hover{background:#00c9a8!important}

  [data-clip]:hover{border-color:rgba(0,229,192,.4)!important;transform:translateY(-4px)}
  [data-clip] video{background:#000}

  @media(max-width:640px){
    nav{flex-wrap:wrap;row-gap:10px}
    nav > div{width:100%;justify-content:space-between;flex-wrap:wrap;row-gap:8px}
    [data-clip-grid]{grid-template-columns:repeat(2,1fr)!important;gap:10px!important}
  }
</style>

<script>
(function(){
  // Force-play each clip on loop while it's actually scrolled into view;
  // pause it otherwise so we're not running 21 videos at once.
  var vids=[].slice.call(document.querySelectorAll('[data-clip] video'));
  if(vids.length&&'IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting) e.target.play().catch(function(){});
        else e.target.pause();
      });
    },{threshold:.35});
    vids.forEach(function(v){io.observe(v)});
  }

  // Background music: off by default (browsers block real autoplay-with-
  // sound anyway), toggled on with one click, and auto-ducked whenever any
  // clip is actively playing so it never competes with a clip's own audio.
  var bgm=document.getElementById('bgm'),soundBtn=document.querySelector('[data-sound-toggle]'),
      soundLabel=document.querySelector('[data-sound-label]'),
      wave1=document.querySelector('[data-sound-wave1]'),wave2=document.querySelector('[data-sound-wave2]'),
      xIcon1=document.querySelector('[data-sound-x1]'),xIcon2=document.querySelector('[data-sound-x2]');
  var musicOn=false;

  function updateSoundIcon(){
    if(wave1) wave1.style.display=musicOn?'':'none';
    if(wave2) wave2.style.display=musicOn?'':'none';
    if(xIcon1) xIcon1.style.display=musicOn?'none':'';
    if(xIcon2) xIcon2.style.display=musicOn?'none':'';
  }

  function anyClipPlaying(){
    // Grid clips autoplay muted as you scroll -- that's not "real audio"
    // competing with the music, so only an unmuted clip (the lightbox,
    // once clips have real sound) should duck the background track.
    return vids.some(function(v){ return !v.paused&&!v.muted; }) || (boxVideo&&!boxVideo.paused&&!boxVideo.muted);
  }

  function syncBgm(){
    if(!bgm) return;
    if(musicOn&&!anyClipPlaying()) bgm.play().catch(function(){});
    else bgm.pause();
  }

  if(soundBtn&&bgm){
    soundBtn.addEventListener('click',function(){
      musicOn=!musicOn;
      bgm.muted=!musicOn;
      if(soundLabel) soundLabel.textContent=musicOn?'Turn music off':'Turn music on';
      soundBtn.classList.toggle('is-on',musicOn);
      updateSoundIcon();
      syncBgm();
    });
  }

  vids.forEach(function(v){
    v.addEventListener('play',syncBgm);
    v.addEventListener('pause',syncBgm);
  });

  // Best-effort autoplay: browsers only allow unmuted autoplay once a
  // visitor has already interacted with the site this session (e.g.
  // clicked something on the homepage first). Try it; if it's blocked,
  // fall back silently to the button -- same off-by-default state as before.
  if(bgm){
    bgm.muted=false;
    bgm.play().then(function(){
      musicOn=true;
      if(soundLabel) soundLabel.textContent='Turn music off';
      updateSoundIcon();
      if(soundBtn) soundBtn.classList.add('is-on');
    }).catch(function(){
      bgm.muted=true;
    });
  }

  // Click a clip to pop it up larger, with real controls.
  var box=document.querySelector('[data-lightbox]'),boxVideo=document.querySelector('[data-lightbox-video]'),
      closeBtn=document.querySelector('[data-lightbox-close]');
  if(box&&boxVideo){
    function openLightbox(src){
      boxVideo.src=src;
      box.style.display='flex';
      document.body.style.overflow='hidden';
      boxVideo.play().catch(function(){});
    }
    function closeLightbox(){
      box.style.display='none';
      document.body.style.overflow='';
      boxVideo.pause();
      boxVideo.removeAttribute('src');
      boxVideo.load();
    }
    vids.forEach(function(v){
      var tile=v.closest('[data-clip]');
      if(!tile) return;
      tile.style.cursor='zoom-in';
      tile.addEventListener('click',function(){
        var src=v.querySelector('source');
        openLightbox(src?src.src:v.currentSrc);
      });
    });
    if(closeBtn) closeBtn.addEventListener('click',closeLightbox);
    box.addEventListener('click',function(e){ if(e.target===box) closeLightbox(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLightbox(); });
  }

  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var beam=document.getElementById('beam'),dot=document.getElementById('dot');
  if(!beam||!dot) return;
  var tx=innerWidth/2,ty=innerHeight/2,cx=tx,cy=ty,fade;
  document.addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY;beam.style.opacity='1';dot.style.opacity='1'});
  document.addEventListener('mouseleave',function(){beam.style.opacity='0';dot.style.opacity='0'});
  function touch(e){var t=e.touches&&e.touches[0];if(!t)return;tx=t.clientX;ty=t.clientY;beam.style.opacity='1';dot.style.opacity='1';clearTimeout(fade)}
  document.addEventListener('touchstart',touch,{passive:true});
  document.addEventListener('touchmove',touch,{passive:true});
  document.addEventListener('touchend',function(){fade=setTimeout(function(){beam.style.opacity='0';dot.style.opacity='0'},900)},{passive:true});
  (function loop(){
    cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;
    beam.style.width=Math.sqrt(cx*cx+cy*cy)+'px';
    beam.style.transform='rotate('+(Math.atan2(cy,cx)*180/Math.PI)+'deg)';
    dot.style.left=cx+'px';dot.style.top=cy+'px';
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
